name: Recheck Adapter Coverage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ebooklib Pillow beautifulsoup4

      - name: Recheck active failure coverage
        run: |
          PYTHONPATH=. python scripts/recheck_adapter_coverage.py

      - name: Commit updated resolution history
        run: |
          if [ -f data/adapter-resolution.jsonl ] && ! git diff --quiet -- data/adapter-resolution.jsonl; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/adapter-resolution.jsonl
            git commit -m "chore: recheck adapter coverage"
            git push
          else
            echo "No resolution-history changes to commit."
          fi
