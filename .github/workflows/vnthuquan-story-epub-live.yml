name: Live Story EPUB Test

on:
  workflow_dispatch:
    inputs:
      story_url:
        description: "VnThuQuan story URL"
        required: true
        default: "https://thuvien.vnthuquan.net/TacPham/doi-san-cua-quoc-vuong-xtac-18550/"

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-story-scraper.txt
          pip install pytest
      - name: Run live Story EPUB test
        env:
          VNTHUQUAN_TEST_URL: ${{ inputs.story_url }}
        run: PYTHONPATH=. pytest -v -m integration tests/integration/test_vnthuquan_story_epub_live.py
      - name: Upload generated EPUB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0neStory-epub
          path: /tmp/pytest-of-runner/**/0neStory.epub
          if-no-files-found: warn
