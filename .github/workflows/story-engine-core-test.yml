name: Story Engine Core Test

on:
  workflow_dispatch:

jobs:
  story-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-story-scraper.txt
          pip install pytest

      - name: Run Story Engine tests
        run: PYTHONPATH=. pytest -v tests/test_story_engine.py tests/test_story_epub.py
