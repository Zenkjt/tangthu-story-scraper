name: Application Entrypoint Test

on:
  workflow_dispatch:

jobs:
  application:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-story-scraper.txt
          pip install pytest

      - name: Run application entrypoint tests
        run: PYTHONPATH=. pytest -v tests/test_application.py tests/test_adapter_registry.py
