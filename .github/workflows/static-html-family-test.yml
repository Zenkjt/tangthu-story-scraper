name: Static HTML Family Adapter Test

on:
  workflow_dispatch:

jobs:
  static-html-family:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-story-scraper.txt
          pip install pytest

      - name: Run static HTML family tests
        run: |
          PYTHONPATH=. pytest -v \\
            tests/test_static_html_family.py \\
            tests/test_adapter_registry.py \\
            tests/test_application.py
