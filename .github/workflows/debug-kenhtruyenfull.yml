name: Debug KenhTruyenFull

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and inspect KenhTruyenFull
        run: python scripts/debug_kenhtruyenfull.py
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kenhtruyenfull-debug
          path: .debug-kenhtruyenfull/
          if-no-files-found: warn
