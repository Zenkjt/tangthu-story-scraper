name: Manifest Store Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ebooklib Pillow beautifulsoup4

      - name: Test Manifest Store
        run: |
          PYTHONPATH=. pytest -v tests/test_story_manifest.py

      - name: Test Manifest Integration
        run: |
          PYTHONPATH=. pytest -v tests/test_application_manifest_integration.py

      - name: Test Story Catalog / TOC EPUB
        run: |
          PYTHONPATH=. pytest -v tests/test_story_catalog.py
