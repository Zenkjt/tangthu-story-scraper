name: Live Wattpad Test

on:
  workflow_dispatch:

jobs:
  wattpad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-story-scraper.txt
          pip install pytest

      - name: Run Wattpad live tests
        env:
          PYTHONPATH: .
        run: |
          pytest -v tests/test_wattpad_adapter.py
