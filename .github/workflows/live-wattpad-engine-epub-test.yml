name: Live Wattpad Engine EPUB Test

on:
  workflow_dispatch:

jobs:
  wattpad-engine-epub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-story-scraper.txt
          pip install pytest

      - name: Run live Wattpad engine + EPUB test
        run: PYTHONPATH=. pytest -s -v tests/integration/test_wattpad_engine_live.py
